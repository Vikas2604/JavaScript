    .red-button {

      color: white;
      font-size: 2rem;
      width: 30%;
    }
  </style>
</head>

<body>

      alert(`Good Job!`);
    ">

  </button>
  <p>

    labore quisquam a explicabo voluptate vel consectetur inventore deleniti laborum. Aut animi id possimus quasi.
  </p>
  <script>
    //This is a alert message it creates a pop up everytime we refresh the page 
    alert(`Hello!`);

</html>
