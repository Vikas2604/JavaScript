<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RockPaperScissors</title>
  <style>
    body {
      background-color: black;
      color: white;
    }

    h1 {
      text-align: center;
    }

    div {
      display: flex;
      justify-content: space-evenly;
      margin-top: 10%;
    }

    button {
      border: none;
      background-color: blanchedalmond;
      width: 20%;
      height: 100px;
      cursor: pointer;
      font-size: 1.5em;
    }

    button:hover {
      background-color: burlywood;
      scale: 1.1;
    }
  </style>
</head>

<body>
  <h1>Rock Paper Scissors</h1>
  <div>
    <button onclick="playGame('Rock')">
      Rock
    </button>
    <button onclick="playGame('Paper')">
      Paper
    </button>
    <button onclick="playGame('Scissors')">
      Scissors
    </button>
  </div>
  <h1 id="result"></h1>
  <script>

    //Creating a Function which makes the game playable and useful.
    //With the help of Math.random we can generate a random number between 0 and 1 that will play as the computer and the user can select his choise.
    function playGame(playerChoice) {
      const randomNumber = Math.random();
      let computerChoice = '';

      if (randomNumber < 1 / 3) {
        computerChoice = 'Rock';
      } else if (randomNumber < 2 / 3) {
        computerChoice = 'Paper';
      } else {
        computerChoice = 'Scissors';
      }

      let result = '';

      if (playerChoice === computerChoice) {
        result = "It's a tie";
      } else if (
        (playerChoice === 'Rock' && computerChoice === 'Scissors') ||
        (playerChoice === 'Paper' && computerChoice === 'Rock') ||
        (playerChoice === 'Scissors' && computerChoice === 'Paper')
      ) {
        result = 'You Win!';
      } else {
        result = 'You Lose...';
      }
      document.getElementById('result').textContent = `You chose ${playerChoice} and the computer chose ${computerChoice}: ${result}`
    }
  </script>
</body>

</html>
