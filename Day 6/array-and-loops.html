<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrays and Loops</title>
</head>

<body>


  <script>

    const myArray = [10, 20, 30];
    console.log(myArray);


    console.log(myArray[0]);

    //Changing value of an array.
    // myArray[0] = 99;
    // console.log(myArray[0]);


    [1, 'hello', true, { name: 'socks', price: 120 }, [1, 2]];

    console.log(typeof [1, 2]);

    console.log(Array.isArray([1, 2]));

    console.log(myArray.length);

    // Method to add something to the array at the end
    myArray.push(100);
    console.log(myArray);

    // Method to remove value from an array
    // splice takes 2 values (starting_index, number_of_values_to_be_removed)
    myArray.splice(0, 1);
    console.log(myArray);

    console.log('Loops');

    let i = 1;
    while (i <= 5) {
      console.log(i);
      i++;
    }

    console.log('For Loop');

    for (i = 1; i <= 10; i++) {
      console.log(i);
    }

    console.log('Random Number');
    let randomNumber = 0;

    while (randomNumber < 0.5) {
      randomNumber = Math.random();

    }
    console.log(randomNumber);

    const todoList = ['make dinner', 'wash dishes', 'watch yt'];

    for (i = 0; i < todoList.length; i++) {
      const value = todoList[i];
      console.log(value);
    }
    console.log('Accumilator');

    const nums = [1, 1, 3];
    let total = 0;

    for (i = 0; i < nums.length; i++) {
      const num = nums[i];
      total += num;

    }
    console.log(total);

  </script>

</body>

</html>
