<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Mastery</title>
</head>

<body>
  <button onclick="
    console.log(`Cart Quantity: ${cartQty}`);
    ">Show Quantity</button>
  <button onclick="
      cartQty++;
      console.log(`Cart Quantity: ${cartQty}`);
  ">Add to Cart</button>
  <button onclick="
      cartQty+= 2;
      console.log(`Two items added to the cart, total Qty: ${cartQty}`);
  ">+2</button>
  <button onclick="
      cartQty+=3;
      console.log(`Three items added to the cart, total Qty: ${cartQty}`);
  ">+3</button>
  <button onclick="
      cartQty = 0;
      console.log(`Cart was RESET.`);
      console.log(`Cart Quantity: ${cartQty = 0}`)
  ">Reset Cart</button>

  <script>
    let cartQty = 0;

  </script>

</body>

</html>
