<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Mastery Boolean & Statements</title>
</head>

<body>

  <script>
    console.log(typeof true);
    console.log(3 < 5);
    console.log(5 == '5.00'); //True
    console.log(5 === '5.00');  //False

    if (false) {
      console.log('Hello');
    } else {
      console.log('WHYYY');
    }

    age = 17;
    if (age >= 18) {
      console.log(`You can drive! Since your age is ${age}`);
    } else {
      console.log(`You cant drive, because youre below 18.`);
    }

  </script>

</body>

</html>
