<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>

  </style>
</head>

<body>
  <h1>YouTube Subscribe Button</h1>
  <button id="sub-btn" onclick="subscribeBtn()">Subscribe</button>


  <h1>Amazon Shipping Calculator</h1>
  <h2>Orders under ₹499 = ₹99 Shipping </h2>
  <h2>Orders over ₹499 = FREE Shipping</h2>
  <input placeholder="Cost of Order" id="cost-input" onkeydown="handleCostKeydown(event)">
  <button onclick="shippingCalculaor()">Calculate</button>
  <h1 class="calculated-shipping"></h1>

  <script>
    // window.document


    // document.body.innerHTML = 'hello';
    // document.title = 'New DOM'; 

    const subBtn = document.querySelector('#sub-btn');

    if (localStorage.getItem('Subscribed') === 'true') {
      subBtn.innerHTML = 'Subscribed';
    };

    function subscribeBtn() {
      console.log(subBtn);
      if (subBtn.innerText === 'Subscribe') {
        subBtn.innerHTML = 'Subscribed';
        localStorage.setItem('Subscribed', 'true');
      } else {
        subBtn.innerHTML = 'Subscribe';
        localStorage.setItem('Subscribed', 'false');

      }
    }

    // console.log(localStorage.setItem('subBtn', 'subBtn'));

    // const subBtn = document.querySelector('#sub-btn');

    // console.log(subBtn);

    // subBtn.innerHTML = 'Subscribed';

    const calculateOrder = document.querySelector('#cost-input');
    const shippingCost = document.querySelector('.calculated-shipping');
    console.log(calculateOrder);

    function shippingCalculaor() {
      const cost = calculateOrder.value;

      if (cost < 499) {
        shippingCost.innerText = `₹${Number(cost) + 99}`;

      } else {
        shippingCost.innerText = 'FREE SHIPPING!';
      }

    }

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        shippingCalculaor();
      }
    }



  </script>

</body>

</html>
