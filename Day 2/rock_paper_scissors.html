<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS Game</title>
  <style>
    body {
      background-color: black;
      color: white;
    }

    h1 {
      text-align: center;
    }

    div {
      margin-top: 10%;
      display: flex;
      justify-content: space-around;
    }

    button {
      width: 20%;
      height: 100px;
      border: none;
      background-color: bisque;
      font-size: 1.5em;
    }

    button:hover {
      background-color: burlywood;
      cursor: pointer;
    }

    .rst-btn {
      height: 50px;
    }
  </style>
</head>

<body>
  <h1>Rock Paper Scissors</h1>
  <div>
    <button onclick="playGame('Rock')">Rock</button>
    <button onclick="playGame('Paper')">Paper</button>
    <button onclick="playGame('Scissors')">Scissors</button>
  </div>
  <h1 id="result"></h1>
  <h1>Score</h1>
  <div>
    <h2>Wins:
      <span id="wins">0</span>
    </h2>
    <h2>Losses:
      <span id="losses">0</span>
    </h2>
    <h2>Ties:
      <span id="ties">0</span>
    </h2>
  </div>
  <div>
    <button class="rst-btn" onclick="rstBtn()">Reset Score</button>
  </div>
  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    console.log(score);

    // if (score === null) {
    //   score = {
    //     wins: 0,
    //     losses: 0,
    //     ties: 0
    //   }
    // };

    // console.log(localStorage.getItem('result'));

    function updateScoreDisplay() {
      document.getElementById('wins').textContent = score.wins;
      document.getElementById('losses').textContent = score.losses;
      document.getElementById('ties').textContent = score.ties;
    }

    function playGame(playerChoice) {
      const random = Math.random();
      let compChoice = ' ';

      if (random < 1 / 3) {
        compChoice = 'Rock';
      } else if (random < 2 / 3) {
        compChoice = 'Paper';
      } else {
        compChoice = 'Scissors';
      }

      let result = ' ';

      if (playerChoice === compChoice) {
        result = 'It is a Tie';
        score.ties += 1;
      } else if (
        (playerChoice === 'Rock' && compChoice === 'Scissors') ||
        (playerChoice === 'Paper' && compChoice === 'Rock') ||
        (playerChoice === 'Scissors' && compChoice === 'Paper')
      ) {
        result = 'Congrats! You Won!'
        score.wins += 1;
      } else {
        result = 'You Lost... Better Luck Next Time';
        score.losses += 1;
      }

      document.getElementById('result').textContent = `Your Choice was ${playerChoice} and the Computer Chose ${compChoice} : ${result} `;

      // if (result === 'Congrats! You Won!') {
      //   score.wins += 1;
      // } else if (result === 'You Lost... Better Luck Next Time') {
      //   score.losses += 1;
      // } else if (result === 'It is a Tie') {
      //   score.ties += 1;
      // }

      document.getElementById('wins').textContent = score.wins;
      document.getElementById('losses').textContent = score.losses;
      document.getElementById('ties').textContent = score.ties;


      localStorage.setItem('score', JSON.stringify(score));
    }

    // localStorage.setItem('result', 'hello');




    function rstBtn() {
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      }

      document.getElementById('wins').textContent = score.wins;
      document.getElementById('losses').textContent = score.losses;
      document.getElementById('ties').textContent = score.ties;

      localStorage.setItem('score', JSON.stringify(score));
      document.getElementById('ties').textContent = alert("Score Reset!");
    }

    window.onload = updateScoreDisplay;

  </script>
</body>

</html>
